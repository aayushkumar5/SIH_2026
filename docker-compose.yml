services:
  # Central PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ibvap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibvap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ibvap_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Central Backend API & WebSocket Gateway
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ibvap-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ibvap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ibvap_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      BOP_ID: ${BOP_ID:-BOP-DHARCHULA-01}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./storage:/app/storage

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibvap-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
